<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XOR Real-Time Canvas & Harmonic Wave</title>
  <style>
    :root {
      --bg-color: #fff0f4;
      --card-bg: #ffffff;
      --primary-pink: #ec4899;
      --deep-maroon: #4a0e2a;
    }
    body {
      margin: 0;
      padding: 2rem;
      background-color: var(--bg-color);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--deep-maroon);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 90vh;
    }
    .card {
      background: var(--card-bg);
      border-radius: 1.5rem;
      padding: 2rem;
      border: 1px solid #fbcfe8;
      box-shadow: 0 10px 25px -5px rgba(236, 72, 153, 0.15);
      max-width: 600px;
      width: 100%;
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      color: var(--deep-maroon);
    }
    canvas {
      width: 100%;
      height: 120px;
      background: #fdf2f8;
      border-radius: 1rem;
      margin: 1.5rem 0;
    }
    .badge {
      display: inline-block;
      padding: 0.35rem 0.85rem;
      background: #fce7f3;
      color: #be185d;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">XOR Real-Time Engine</span>
    <h1>Interactive Harmonic Canvas</h1>
    <p>Live synchronized HTML5 visual layer rendered with mathematical harmonic oscillation.</p>
    <canvas id="waveCanvas"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('waveCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;

    let step = 0;
    function renderWave() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.beginPath();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#ec4899';

      const height = canvas.height / 2;
      for (let x = 0; x < canvas.width; x++) {
        const y = Math.sin((x + step) * 0.03) * 20 + height;
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
      step += 1.5;
      requestAnimationFrame(renderWave);
    }
    renderWave();
  </script>
</body>
</html>
